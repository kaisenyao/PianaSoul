[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pianasoul"
version = "0.1.0"
description = "Piano recordings made into performance MIDI, and an assistant who plays them on your piano."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# The library, the player and the phone's page: all a piano and your own MIDI files need.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "pretty_midi",
    "mido",
    "watchdog",
    "send2trash",
]

[project.optional-dependencies]
# Transcription, finding pieces online, and her: the large downloads, and the services that need keys.
# yt-dlp's own deno extra: the JavaScript runtime YouTube's pages need, installed beside Python, where yt-dlp looks.
advanced = ["transkun==2.0.1", "torch", "imageio-ffmpeg", "yt-dlp[default,deno]", "openai", "anthropic", "sherpa-onnx",
            "pypinyin"]
# Her, on the Mac's own microphone (./run.sh voice).
voice = ["pianasoul[advanced]", "sounddevice"]

[project.scripts]
pianasoul = "pianasoul.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pianasoul = ["web/*"]

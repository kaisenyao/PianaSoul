<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 392" width="980" height="392" role="img" aria-label="Why notes are sent one second early" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg { fill: none; stroke: none; }
  .box { fill: #f6f8fa; stroke: #d0d7de; }

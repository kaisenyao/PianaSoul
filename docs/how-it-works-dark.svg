<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" width="980" height="370" role="img" aria-label="How PianaSoul works" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg { fill: none; stroke: none; }
  .box { fill: #f6f8fa; stroke: #d0d7de; }
  .hub { fill: #ddf4ff; stroke: #54aeff; }
  .t { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .s { fill: #59636e; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .q { fill: #0969da; font: italic 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .a { stroke: #59636e; stroke-width: 1.6; fill: none; }
  .ah { fill: #59636e; }
  .k { stroke: #0969da; stroke-width: 1.6; fill: none; }
  .kh { fill: #0969da; }
  .kt { fill: #0969da; font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bad { fill: #cf222e; } .good { fill: #1a7f37; } .note { fill: #59636e; }
  .line { stroke: #d0d7de; stroke-width: 1.2; }
  .lag { stroke: #cf222e; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
  .wait { stroke: #1a7f37; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
    .bg { fill: none; stroke: none; }
    .box { fill: #161b22; stroke: #30363d; }
    .hub { fill: #0c2d4a; stroke: #1f6feb; }
    .t { fill: #e6edf3; } .s { fill: #9198a1; } .q { fill: #4493f8; }
    .a { stroke: #9198a1; } .ah { fill: #9198a1; }
    .k { stroke: #4493f8; } .kh { fill: #4493f8; } .kt { fill: #4493f8; }
    .bad { fill: #f85149; } .good { fill: #3fb950; } .note { fill: #9198a1; }
    .line { stroke: #30363d; }
    .lag { stroke: #f85149; } .wait { stroke: #3fb950; }
</style>
<rect x="0.5" y="0.5" width="979" height="369" rx="14" class="bg"/>
<rect x="20" y="40" width="200" height="120" rx="10" class="box"/>
<text x="120.0" y="68" class="t" text-anchor="middle">You</text>
<text x="120.0" y="90" class="s" text-anchor="middle">by voice or in the chat</text>
<text x="120.0" y="108" class="q" text-anchor="middle">“Hey Jasmine, play Für Elise”</text>
<rect x="310" y="40" width="200" height="120" rx="10" class="hub"/>
<text x="410.0" y="68" class="t" text-anchor="middle">Mac · PianaSoul</text>
<text x="410.0" y="90" class="s" text-anchor="middle">understands the request,</text>
<text x="410.0" y="108" class="s" text-anchor="middle">finds the piece, answers</text>
<text x="410.0" y="126" class="s" text-anchor="middle">and plays it</text>
<rect x="640" y="40" width="150" height="120" rx="10" class="box"/>
<text x="715.0" y="68" class="t" text-anchor="middle">iPad · Pianoteq</text>
<text x="715.0" y="90" class="s" text-anchor="middle">turns MIDI notes</text>
<text x="715.0" y="108" class="s" text-anchor="middle">into piano sound</text>
<rect x="830" y="40" width="130" height="120" rx="10" class="box"/>
<text x="895.0" y="68" class="t" text-anchor="middle">Digital piano</text>
<text x="895.0" y="90" class="s" text-anchor="middle">the sound comes</text>
<text x="895.0" y="108" class="s" text-anchor="middle">out of the piano</text>
<line x1="220" y1="86" x2="306.0" y2="86.0" class="a"/><polygon points="310,86 301.7,89.5 301.7,82.5" class="ah"/>
<text x="265" y="76" class="s" text-anchor="middle">asks</text>
<path d="M 310 126 L 224 126" class="a" stroke-dasharray="4 4"/>
<polygon points="220,126 229,121 229,131" class="ah"/>
<text x="265" y="146" class="s" text-anchor="middle">she answers</text>
<line x1="510" y1="100" x2="636.0" y2="100.0" class="k"/><polygon points="640,100 631.7,103.5 631.7,96.5" class="kh"/>
<text x="575" y="72" class="kt" text-anchor="middle">MIDI over Wi-Fi,</text>
<text x="575" y="90" class="kt" text-anchor="middle">each note 1 s early</text>
<line x1="790" y1="100" x2="826.0" y2="100.0" class="a"/><polygon points="830,100 821.7,103.5 821.7,96.5" class="ah"/>
<text x="810" y="90" class="s" text-anchor="middle">USB</text>
<text x="20" y="228" class="s" text-anchor="start">A new piece is found and transcribed first:</text>
<rect x="20" y="250" width="220" height="92" rx="10" class="box"/>
<text x="130.0" y="278" class="t" text-anchor="middle">A recording</text>
<text x="130.0" y="300" class="s" text-anchor="middle">a video from almost any</text>
<text x="130.0" y="318" class="s" text-anchor="middle">site, or an audio file</text>
<rect x="325" y="250" width="170" height="92" rx="10" class="box"/>
<text x="410.0" y="278" class="t" text-anchor="middle">Library</text>
<text x="410.0" y="300" class="s" text-anchor="middle">your MIDI files</text>
<text x="410.0" y="318" class="s" text-anchor="middle">and a playlist</text>
<line x1="240" y1="296" x2="321.0" y2="296.0" class="a"/><polygon points="325,296 316.7,299.5 316.7,292.5" class="ah"/>
<text x="282" y="286" class="s" text-anchor="middle">transcribed</text>
<text x="282" y="316" class="s" text-anchor="middle">by Transkun</text>
<line x1="410" y1="250" x2="410.0" y2="164.0" class="a"/><polygon points="410,160 413.5,168.3 406.5,168.3" class="ah"/>
</svg>